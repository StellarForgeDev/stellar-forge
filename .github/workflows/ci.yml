name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify recursive dependencies
        run: |
          git submodule status --recursive
          test -f contracts/Cargo.toml
          test -f contracts/contracts/sandbox-runner/Cargo.toml
          test -f contracts/prebuilt/access-control.wasm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/verify-prebuilt.mjs --from-package contracts/prebuilt
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          target: wasm32v1-none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clean
      - run: cargo build --target wasm32v1-none --release --workspace --exclude sandbox-runner --exclude greeter --exclude test-asset
      - name: Compare source-built WASM with committed prebuilt artifacts
        run: node scripts/verify-prebuilt.mjs --no-build
        working-directory: .
      - run: sha256sum -c checksums.txt
        working-directory: contracts/prebuilt
      - run: cargo test --workspace
