name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify recursive dependencies
        run: |
          git submodule status --recursive
          test -f contracts/Cargo.toml
          test -f contracts/contracts/sandbox-runner/Cargo.toml
          test -f contracts/prebuilt/access-control.wasm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/verify-prebuilt.mjs --from-package contracts/prebuilt
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          target: wasm32v1-none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clean
      - run: cargo build --target wasm32v1-none --release --workspace --exclude sandbox-runner --exclude greeter --exclude test-asset
      - name: Compare source-built WASM with committed prebuilt artifacts
        run: node scripts/verify-prebuilt.mjs --no-build
        working-directory: .
      - run: sha256sum -c checksums.txt
        working-directory: contracts/prebuilt
      - run: cargo test --workspace
