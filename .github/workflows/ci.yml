name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify recursive dependencies
        run: |
          git submodule status --recursive
          test -f contracts/Cargo.toml
          test -f contracts/contracts/sandbox-runner/Cargo.toml
          test -f contracts/prebuilt/access-control.wasm
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: node scripts/verify-prebuilt.mjs --from-package contracts/prebuilt
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clean
      - run: cargo build --target wasm32v1-none --release --workspace --exclude sandbox-runner --exclude greeter --exclude test-asset
      - name: Compare source-built WASM with committed prebuilt artifacts
        run: node scripts/verify-prebuilt.mjs --no-build
        working-directory: .
      - run: sha256sum -c checksums.txt
        working-directory: contracts/prebuilt
      - run: cargo test --workspace
