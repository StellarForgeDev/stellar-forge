name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust (contract tests + sandbox build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Install Stellar CLI
        env:
          STELLAR_VERSION: 27.1.0
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/stellar-cli.tar.gz
          mkdir -p "$HOME/.local/bin" /tmp/stellar-extract
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp/stellar-extract
          BIN=$(find /tmp/stellar-extract -type f -name stellar | head -n1)
          cp "$BIN" "$HOME/.local/bin/stellar"
          chmod +x "$HOME/.local/bin/stellar"
          "$HOME/.local/bin/stellar" --version

      - name: Add Stellar CLI to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run contract tests
        working-directory: contracts
        run: cargo test

      - name: Build sandbox runner + contract wasm
        run: node scripts/sandbox-build.mjs
